name: Android Development

on: 
    push:
        branches:
            - master
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: SetupNode.js
            uses: actions/setup-node@v4
            with:
                node-version: '20'
                cache: 'npm'

          - name: Install dependencies
            run: npm ci 

          - name: Setup EAS
            uses: expo/expo-github-action@v8 
            with:
                eas-version: latest
                token: ${5qkVgGFe78ClQQVecZivQ3QZWrLVUTmEI8NOuAZn}

          - name: Build Android APK
            run: eas build --profile developmenrt --platform android --non-interactive
            
            

