name: PR Quality Check

on:
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ObsidianRoutes/package-lock.json

      - name: Install dependencies
        working-directory: ObsidianRoutes
        run: npm ci

      - name: Run ESLint
        working-directory: ObsidianRoutes
        run: npx eslint . --ext .ts,.tsx

      - name: Run TypeScript type check
        working-directory: ObsidianRoutes
        run: npx tsc --noEmit

      - name: Run Prettier check
        working-directory: ObsidianRoutes
        run: npx prettier --check .

      - name: Run Jest tests
        working-directory: ObsidianRoutes
        run: npx jest --passWithNoTests
